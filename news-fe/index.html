<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Synthetica — News Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'canvas': '#060e20',
                        'surface-1': '#091328',
                        'surface-2': '#0f1a35',
                        'surface-3': '#192540',
                        'surface-4': '#1f2b49',
                        'primary': '#85adff',
                        'primary-dim': '#6e9fff',
                        'primary-deep': '#4a78d8',
                        'secondary': '#9093ff',
                        'tertiary': '#ac8aff',
                        'on-surface': '#dee5ff',
                        'on-surface-muted': '#7b86a8',
                        'on-surface-subtle': '#4a5273',
                        'accent-error': '#ff716c',
                        'accent-success': '#6fcf97',
                        'accent-warning': '#f2c94c',
                        'outline': '#2a3352',
                    },
                    fontFamily: {
                        'display': ['Manrope', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'slide-in': 'slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                        'fade-in': 'fadeIn 0.4s ease-out',
                    },
                }
            }
        }
    </script>
    <style>
        :root {
            --canvas: #060e20;
            --surface-1: #091328;
            --surface-2: #0f1a35;
            --surface-3: #192540;
            --surface-4: #1f2b49;
            --primary: #85adff;
            --primary-dim: #6e9fff;
            --tertiary: #ac8aff;
            --on-surface: #dee5ff;
        }

        * { scrollbar-width: thin; scrollbar-color: #1f2b49 #060e20; }
        *::-webkit-scrollbar { width: 8px; height: 8px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb { background: #1f2b49; border-radius: 4px; }
        *::-webkit-scrollbar-thumb:hover { background: #2a3a5e; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--canvas);
            color: var(--on-surface);
            background-image:
                radial-gradient(ellipse at top left, rgba(133, 173, 255, 0.08), transparent 40%),
                radial-gradient(ellipse at bottom right, rgba(172, 138, 255, 0.05), transparent 40%);
            min-height: 100vh;
        }

        .material-icons-outlined { vertical-align: middle; }

        /* Sidebar */
        .sidebar-item {
            position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%) scaleY(0);
            width: 3px;
            height: 60%;
            background: linear-gradient(to bottom, var(--primary), var(--tertiary));
            border-radius: 0 3px 3px 0;
            transition: transform 0.2s ease;
        }
        .sidebar-item:hover { background: rgba(25, 37, 64, 0.5); color: var(--on-surface); }
        .sidebar-item:hover::before { transform: translateY(-50%) scaleY(1); }
        .sidebar-item.active {
            background: linear-gradient(90deg, rgba(133, 173, 255, 0.12), transparent);
            color: var(--primary);
        }
        .sidebar-item.active::before { transform: translateY(-50%) scaleY(1); }

        /* Glass cards */
        .glass {
            background: rgba(15, 26, 53, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Subtle shimmer on gradient buttons */
        .btn-primary {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #85adff 0%, #6e9fff 100%);
            color: #060e20;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(133, 173, 255, 0.15);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(133, 173, 255, 0.3);
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .btn-primary:hover::after { left: 100%; }

        /* Card with glow on hover */
        .card-hover {
            transition: transform 0.2s, box-shadow 0.3s;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(133, 173, 255, 0.15);
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Status dot with pulse */
        .dot-running::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: #6fcf97;
            opacity: 0.3;
            animation: pulse 2s infinite;
        }

        /* Input/textarea focus rings */
        input:focus, textarea:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(133, 173, 255, 0.4);
        }

        /* Tab underline animation */
        .tab-item {
            position: relative;
            transition: color 0.2s;
        }
        .tab-item::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 50%;
            width: 0; height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--tertiary));
            transition: all 0.3s;
            transform: translateX(-50%);
        }
        .tab-item.active { color: var(--primary); }
        .tab-item.active::after { width: 100%; }

        /* Table row hover */
        .data-row { transition: background 0.15s; }
        .data-row:hover { background: rgba(31, 43, 73, 0.5); }

        /* Shimmer loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, #0f1a35 0%, #192540 50%, #0f1a35 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Gradient text */
        .text-gradient {
            background: linear-gradient(135deg, #85adff, #ac8aff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Subtle top border glow for cards */
        .card-glow-top {
            position: relative;
        }
        .card-glow-top::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(133, 173, 255, 0.4), transparent);
        }

        /* Badge styles */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body class="flex">

<aside class="w-72 bg-surface-1/40 glass flex flex-col h-screen sticky top-0 border-r border-outline/30">
    <div class="p-6 pb-4">
        <div class="flex items-center gap-3">
            <div class="relative">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-primary via-secondary to-tertiary flex items-center justify-center">
                    <span class="material-icons-outlined text-canvas text-xl" style="font-size: 22px;">auto_awesome</span>
                </div>
                <div class="absolute -inset-1 bg-gradient-to-br from-primary/30 to-tertiary/30 rounded-lg blur-md -z-10"></div>
            </div>
            <div>
                <h1 class="font-display font-extrabold text-lg text-gradient tracking-tight">Synthetica</h1>
                <p class="text-[10px] text-on-surface-muted uppercase tracking-[0.15em]">News Intelligence</p>
            </div>
        </div>
    </div>

    <nav class="flex-1 px-3 overflow-y-auto pb-4">
        <a href="#dashboard" data-nav="dashboard" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-on-surface-muted">
            <span class="material-icons-outlined text-lg">dashboard</span>
            <span>Dashboard</span>
        </a>

        <div class="mt-6 px-4 pb-2 text-[10px] uppercase tracking-[0.15em] text-on-surface-subtle font-semibold">Projects</div>
        <div id="projects-nav"></div>

        <div class="mt-6 px-4 pb-2 text-[10px] uppercase tracking-[0.15em] text-on-surface-subtle font-semibold">System</div>
        <a href="#articles" data-nav="articles" class="sidebar-item flex items-center gap-3 px-4 py-3 rounded-lg text-sm text-on-surface-muted">
            <span class="material-icons-outlined text-lg">article</span>
            <span>Articles</span>
        </a>
    </nav>

    <div class="px-6 py-4 border-t border-outline/30 flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary/30 to-tertiary/30 flex items-center justify-center text-xs font-semibold">AD</div>
        <div class="flex-1 min-w-0">
            <div class="text-xs font-medium truncate">Admin</div>
            <div class="text-[10px] text-on-surface-muted">v0.1.0 · mock mode</div>
        </div>
    </div>
</aside>

<main class="flex-1 overflow-x-hidden">
    <div id="app" class="p-10 max-w-[1400px] mx-auto animate-fade-in"></div>
</main>

<div id="modal" class="hidden fixed inset-0 bg-canvas/80 backdrop-blur-sm z-50 flex items-center justify-center p-4"></div>

<script src="js/mock_data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
